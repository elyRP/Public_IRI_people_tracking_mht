# Author: 

PACKAGE='iri_people_tracking_mht'

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

#       Name                       Type       Reconfiguration level            Description                       Default   Min   Max
#gen.add("velocity_scale_factor",  double_t,  0,                               "Maximum velocity scale factor",  0.5,      0.0,  1.0)
gen.add("max_dist_to_detect_people_conf",  double_t,  0, "threshold to detect people and track them",         60.0,  0.0,  60.0)

gen.add("frame_id",                str_t,     0, "frame to transform poses to", "/map")
gen.add("local_tracker",           bool_t,    0, "enable local tracker", True)
gen.add("association_threshold",   double_t,  0, "distance association threshold", 2,    0.0,  5.0)
gen.add("confirmation_threshold",  double_t,  0, "confirmation threshold",         0.9,  0.0,  1.0)
gen.add("deletion_threshold",      double_t,  0, "deletion threshold",             0.4,  0.0,  1.0)
gen.add("laser_probability",       double_t,  0, "laser detection probability",    0.9,  0.0,  1.0)
gen.add("laser_false_alarm",       double_t,  0, "laser false alarm probability",  0.1,  0.0,  1.0)
gen.add("laser_new_track",         double_t,  0, "laser new track probability",    0.11, 0.0,  1.0)
gen.add("laser_no_detection",      double_t,  0, "laser no detection probability", 0.99,  0.0,  1.0)
gen.add("laser_no_confirmed",      double_t,  0, "laser no confirmed probability", 0.02, 0.0,  1.0)
gen.add("laser_no_confirmed_iteration", double_t,  0, "laser no confirmed iteration probability", 0.01, 0.0,  1.0)
gen.add("augment_covariance_track", double_t,  0, "augment covariance track when not have detection asociated", 0.15, 0.0,  5.0)
gen.add("mht_velocity_margin", double_t,  0, "velocity matgin to update well kalman states of the tracks", 0.1, 0.0,  5.0)
gen.add("covariance_no_track_conf", double_t,  0, "limit for the covariance to delete the track", 20.0, 0.0,  50.0)


gen.add("id_markers",      bool_t,  0, "enable id markers output", True)
gen.add("cov_markers",     bool_t,  0, "enable covariance markers output", True)
gen.add("cov_markers_head",     bool_t,  0, "enable covariance markers (head) output", False)
gen.add("cov_markers_arm1",     bool_t,  0, "enable covariance markers (arm1) output", False)
gen.add("cov_markers_arm2",     bool_t,  0, "enable covariance markers (arm2) output", False)
gen.add("vel_markers",     bool_t,  0, "enable velocity markers output", True)
gen.add("covdet_markers",  bool_t,  1, "enable covariance of detections markers output", True)
gen.add("covpred_markers", bool_t,  0, "enable covariance of predictions markers output", False)
gen.add("id_cluster_markers",      bool_t,  0, "enable id clust markers output", False)
gen.add("clust_markers", bool_t,  0, "enable cluster markers output", False)
gen.add("group_markers", bool_t,  0, "enable group markers output", False)
gen.add("track_path", bool_t,  0, "enable group markers output", False)

gen.add("generate_database_companion", bool_t,  0, "enable group markers output", False)
gen.add("fuse_tibi_and_teo_tracks", bool_t,  0, "enable group markers output", False)
gen.add("debug_fuse_tibi_and_teo_tracks", bool_t,  0, "enable group markers output", False)


exit(gen.generate(PACKAGE, "PeopleTrackingMhtAlgorithm", "PeopleTrackingMht"))
